<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>og-card blog</title>
    <link rel="stylesheet" href="card.css" />
    <script src="render.js"></script>
  </head>
  <body>
    <!-- (b) Blog post: kicker, title, author with avatar, the monkey on a yellow disc. -->
    <div class="frame t-blog">
      <div class="ring"></div>
      <div class="disc"><img src="assets/monkey-head.png" alt="" /></div>
      <div class="text">
        <div class="kicker" data-field="kicker"></div>
        <div class="body">
        <h1 class="title" data-field="title" data-fit="76,46,4"></h1>
        <div class="author">
          <img class="avatar" alt="" />
          <div><div class="name" data-field="author"></div><div class="role" data-field="role"></div></div>
        </div>
        </div>
      </div>
      <div class="foot"><img class="wordmark" src="assets/wordmark-on-dark.svg" alt="Wopee.io" /></div>
    </div>
  </body>
</html>
