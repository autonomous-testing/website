<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>og-card blog</title>
    <link rel="stylesheet" href="card.css" />
    <script src="render.js"></script>
  </head>
  <body>
    <!-- (b) Blog post, ink: white punchline, the monkey on its yellow disc, the white wordmark, the author. -->
    <div class="frame t-blog">
      <div class="kicker" data-field="kicker"></div>
      <img class="mascot" src="../../../static/brand/svg/wopee-mascot-head-color-dark.svg" alt="" />
      <div class="punch"><h1 class="punchline" data-field="punchline" data-fit="170,84,3"></h1></div>
      <img class="logo" src="../../../static/brand/svg/wopee-wordmark-mono-white.svg" alt="Wopee.io" />
      <div class="author"><img class="avatar" alt="" /><div class="name" data-field="author"></div></div>
    </div>
  </body>
</html>
