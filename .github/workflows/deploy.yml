name: Deploy to GitHub Pages
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history: Docusaurus derives sitemap <lastmod> from each file's git date.
          # With a shallow clone every page reports the deploy date and IndexNow would
          # resubmit the whole site on every deploy.
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          # cache: yarn

      - name: If repo is website-prod replace text website.wopee.io to wopee.io and write production robots.txt
        if: github.repository == 'autonomous-testing/website-prod'
        run: |
          sed -i 's/website.wopee.io/wopee.io/g' ./CNAME
          sed -i 's/website.wopee.io/wopee.io/g' ./docusaurus.config.js
          sed -i 's/dev.wopee.io/wopee.io/g' ./cmdBaseUrl.js
          cp ./static/robots.prod.txt ./static/robots.txt

      - name: If repo is website-prod replace text website.wopee.io to wopee.io and remove robots.txt
        if: github.repository == 'autonomous-testing/website-demo'
        run: |
          sed -i 's/website.wopee.io/demo.wopee.io/g' ./CNAME
          sed -i 's/website.wopee.io/demo.wopee.io/g' ./docusaurus.config.js
          sed -i 's/dev.wopee.io/test.wopee.io/g' ./cmdBaseUrl.js

      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Build website
        run: yarn build

      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload entire repository
          path: "./build"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        # The Pages backend finalizes a deployment asynchronously after the
        # action returns, so a deploy that closely follows another can hit
        # "due to in progress deployment" (HTTP 400). Don't fail the job yet:
        # wait for the previous deployment to clear and retry once.
        continue-on-error: true

      - name: Wait for the previous Pages deployment to clear
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5

      # IndexNow: tell Bing and Yandex which pages changed, instead of waiting for their crawl.
      # Google ignores IndexNow. Production only; the key file lives in static/.
      - name: Submit changed pages to IndexNow
        if: github.repository == 'autonomous-testing/website-prod' && (steps.deployment.outcome == 'success' || steps.deployment_retry.outcome == 'success')
        continue-on-error: true
        run: |
          KEY=e7780840a47ed6825300aa66a0cf8e98
          HOST=wopee.io
          SINCE=$(date -u -d '8 days ago' +%Y-%m-%d)
          node -e '
            const fs = require("fs");
            const xml = fs.readFileSync("build/sitemap.xml", "utf8");
            const since = process.argv[1];
            const urls = [...xml.matchAll(/<url><loc>([^<]+)<\/loc><lastmod>([^<]+)<\/lastmod>/g)]
              .filter(([, , d]) => d >= since).map(([, u]) => u);
            fs.writeFileSync("indexnow.json", JSON.stringify({ host: process.argv[2], key: process.argv[3], keyLocation: `https://${process.argv[2]}/${process.argv[3]}.txt`, urlList: urls }));
            console.log(`${urls.length} pages changed since ${since}`);
          ' "$SINCE" "$HOST" "$KEY"
          if [ "$(node -e 'console.log(JSON.parse(require("fs").readFileSync("indexnow.json","utf8")).urlList.length)')" = "0" ]; then echo "nothing to submit"; exit 0; fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST 'https://api.indexnow.org/indexnow' -H 'Content-Type: application/json; charset=utf-8' --data @indexnow.json)
          echo "IndexNow responded $code (200/202 = accepted)"
