<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>og-card changelog</title>
    <link rel="stylesheet" href="card.css" />
    <script src="render.js"></script>
  </head>
  <body>
    <!-- (a) Changelog entry, ink: white punchline, and the GIF frame with a monkey sticker (has-shot)
         or the monkey on its yellow disc (no-shot). Kicker and logo for the full-width card. -->
    <div class="frame t-changelog">
      <div class="kicker" data-field="kicker"></div>
      <img class="mascot only-pattern" src="../../../static/brand/svg/wopee-mascot-head-color-dark.svg" alt="" />
      <div class="shot only-shot"><div class="bar"><i></i><i></i><i></i></div><img alt="" /></div>
      <img class="sticker only-shot" src="../../../static/brand/svg/wopee-mascot-head-color-dark.svg" alt="" />
      <div class="punch"><h1 class="punchline" data-field="punchline" data-fit="170,84,3"></h1></div>
      <img class="logo" src="../../../static/brand/svg/wopee-wordmark-mono-white.svg" alt="Wopee.io" />
    </div>
  </body>
</html>
