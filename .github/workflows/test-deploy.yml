name: Test deployment

on:
  pull_request:
    branches:
      - main
    # Review gh actions docs if you want to further define triggers, paths, etc
    # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#on

jobs:
  test-deploy:
    name: Test deployment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          # cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Check share cards are up to date
        run: node scripts/og-cards/generate.cjs --check
      - name: Test build website
        run: yarn build
        # Production build, so the SEO check sees indexable pages (staging builds are all noindex).
        env:
          WOPEE_SITE: production
      - name: Check SEO meta (titles, descriptions, alt text, og:image)
        run: node scripts/check-seo-meta.js
