<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>og-card blog</title>
    <link rel="stylesheet" href="card.css" />
    <script src="render.js"></script>
  </head>
  <body>
    <!-- (b) Blog post, ink: the punchline in yellow, the monkey on a yellow disc, the author. -->
    <div class="frame t-blog">
      <div class="kicker" data-field="kicker"></div>
      <div class="disc"><img src="assets/monkey.png" alt="" /></div>
      <div class="punch"><h1 class="punchline" data-field="punchline" data-fit="170,84,3"></h1></div>
      <img class="logo" src="assets/logo-on-ink.svg" alt="Wopee.io" />
      <div class="author"><img class="avatar" alt="" /><div class="name" data-field="author"></div></div>
    </div>
  </body>
</html>
