<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>og-card changelog</title>
    <link rel="stylesheet" href="card.css" />
    <script src="render.js"></script>
  </head>
  <body>
    <!-- (a) Changelog entry, yellow: the punchline, and the GIF frame with a monkey sticker (has-shot)
         or the big monkey (no-shot). Kicker and logo for the full-width card. -->
    <div class="frame t-changelog">
      <div class="kicker" data-field="kicker"></div>
      <img class="monkey only-pattern" src="assets/monkey.png" alt="" />
      <div class="shot only-shot"><div class="bar"><i></i><i></i><i></i></div><img alt="" /></div>
      <div class="disc sticker only-shot"><img src="assets/monkey.png" alt="" /></div>
      <div class="punch"><h1 class="punchline" data-field="punchline" data-fit="170,84,3"></h1></div>
      <img class="logo" src="assets/logo-on-yellow.svg" alt="Wopee.io" />
    </div>
  </body>
</html>
